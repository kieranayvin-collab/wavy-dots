<!DOCTYPE html>
<!--
  AR.js marker-based demo — animated strings of blue dots that
  grow/shrink and wave as if moved by water.

  ===========================================================
  NFT MODE (tracking a real photo/logo instead of Hiro marker)
  ===========================================================
  1. Go to https://carnaux.github.io/NFT-Marker-Creator/ and upload
     your image (works best with detailed, high-contrast photos —
     avoid plain logos or flat colors, they track poorly).
  2. Download the generated .fset, .fset3, and .iset files.
  3. Rename all three to the same base name, e.g. "mymarker.fset",
     "mymarker.fset3", "mymarker.iset".
  4. Upload all three files into a "markers" folder next to this
     index.html in your GitHub repo (path: markers/mymarker.fset etc).
  5. The <a-nft> tag below is already set up — just change its
     "url" attribute to match your filename base, e.g.
     url="markers/mymarker" (no file extension).
  6. If the dots appear off-center, too big/small, or tilted, tweak
     the position/rotation/scale on the <a-entity wave-dots> inside
     <a-nft> — NFT's coordinate space is based on your source image's
     pixel dimensions, so the right numbers vary per image.
  7. Commit, wait ~1 min for GitHub Pages to redeploy, then point
     your phone's camera at a printed copy or on-screen display of
     your original image.

  DEPLOYMENT (same as before):
  Deploy to any HTTPS host (GitHub Pages, Netlify, Vercel). Camera
  access requires a secure context — file:// won't work.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Wave Dots</title>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.5.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .arjs-loader div {
      text-align: center;
      font-size: 1.1em;
      color: white;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <div class="arjs-loader">
    <div>Loading AR experience, please wait...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    renderer="alpha: true; antialias: true; logarithmicDepthBuffer: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <!--
      Replace "logo-marker" below with the base filename (no extension)
      of the .fset / .fset3 / .iset files you generated and uploaded.
      e.g. if your files are "logo-marker.fset" etc, leave this as-is.
      If they're in a subfolder, use "assets/logo-marker" etc.
    -->
    <a-nft
      type="nft"
      url="banana"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <a-entity
        wave-dots
        position="150 150 0"
        rotation="-90 0 0"
        scale="0.6 0.6 0.6"
      ></a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Remove the loading overlay once AR.js is ready
    window.addEventListener('arjs-video-loaded', function () {
      var loader = document.querySelector('.arjs-loader');
      if (loader) loader.style.display = 'none';
    });

    AFRAME.registerComponent('wave-dots', {
      init: function () {
        this.dots = [];

        var numStrings = 6;      // how many parallel strings of dots
        var dotsPerString = 14;  // dots along each string
        var stringSpacing = 0.09;
        var dotSpacing = 0.045;
        var baseRadius = 0.018;

        for (var s = 0; s < numStrings; s++) {
          for (var i = 0; i < dotsPerString; i++) {
            var geometry = new THREE.SphereGeometry(baseRadius, 10, 10);
            var material = new THREE.MeshStandardMaterial({
              color: 0x2f8fff,
              transparent: true,
              opacity: 0.85,
              emissive: 0x1a4fbf,
              emissiveIntensity: 0.4
            });
            var mesh = new THREE.Mesh(geometry, material);

            mesh.position.set(
              (s - (numStrings - 1) / 2) * stringSpacing,
              0,
              (i - (dotsPerString - 1) / 2) * dotSpacing
            );

            this.el.object3D.add(mesh);
            this.dots.push({
              mesh: mesh,
              baseX: mesh.position.x,
              baseZ: mesh.position.z,
              stringIndex: s,
              dotIndex: i
            });
          }
        }

        // simple ambient + directional light so MeshStandardMaterial is visible
        var ambient = new THREE.AmbientLight(0xffffff, 0.7);
        var directional = new THREE.DirectionalLight(0xffffff, 0.6);
        directional.position.set(0, 1, 1);
        this.el.object3D.add(ambient);
        this.el.object3D.add(directional);
      },

      tick: function (time) {
        var t = time * 0.001;

        this.dots.forEach(function (d) {
          // phase varies along the string and across strings so the
          // wave appears to travel, like a current moving through water
          var phase = t * 1.8 + d.dotIndex * 0.45 + d.stringIndex * 0.35;

          // vertical bob (height "waving")
          d.mesh.position.y = Math.sin(phase) * 0.045;

          // gentle horizontal sway too, for a more fluid feel
          d.mesh.position.x = d.baseX + Math.sin(phase * 0.6) * 0.01;

          // grow/shrink pulsing, offset so it doesn't perfectly sync with height
          var scale = 0.55 + 0.55 * Math.sin(phase + 1.2);
          d.mesh.scale.set(scale, scale, scale);

          // subtle opacity pulse for extra "underwater light" feel
          d.mesh.material.opacity = 0.55 + 0.35 * Math.sin(phase + 0.6);
        });
      }
    });
  </script>
</body>
</html>
